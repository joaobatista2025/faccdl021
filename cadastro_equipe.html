<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Equipe - Sistema</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .formulario-container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #333; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="submit"] { width: 100%; background-color: #28a745; color: white; padding: 12px; margin-top: 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        input[type="submit"]:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="formulario-container">
        <h2>Criar Nova Equipe</h2>
        
        <form action="salvar_equipe.php" method="POST">
            <label for="nome">Nome da Equipe:</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex: Equipe de Desenvolvimento">

            <input type="submit" value="Salvar Equipe">
        </form>
    </div>

</body>
</html>
