<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vincular Membro - Sistema</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .formulario-container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #333; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        input[type="number"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="submit"] { width: 100%; background-color: #6f42c1; color: white; padding: 12px; margin-top: 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        input[type="submit"]:hover { background-color: #59339d; }
    </style>
</head>
<body>

    <div class="formulario-container">
        <h2>Vincular Membro à Equipe</h2>
        
        <form action="salvar_membro.php" method="POST">
            <!-- Usamos type="number" para aceitar apenas os IDs (números) -->
            <label for="membro_id">Código (ID) da Pessoa:</label>
            <input type="number" id="membro_id" name="membro_id" required placeholder="Ex: 1">

            <label for="equipe_id">Código (ID) da Equipe:</label>
            <input type="number" id="equipe_id" name="equipe_id" required placeholder="Ex: 1">

            <input type="submit" value="Salvar Vínculo">
        </form>
    </div>

</body>
</html>
